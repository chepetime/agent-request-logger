name: Real-agent compatibility
on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to exercise against the local test provider
        type: choice
        default: all
        options: [all, claude-code, codex, opencode, pi]
      versions:
        description: Use the pinned agent versions or the newest releases
        type: choice
        default: pinned
        options: [pinned, latest]
  schedule:
    # Weekly early warning: newest agent releases against the current setup.
    - cron: "17 6 * * 1"
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: compatibility-${{ inputs.ref || github.ref }}-${{ inputs.agent || 'all' }}-${{ inputs.versions || github.event_name }}
  cancel-in-progress: true
jobs:
  agents:
    name: Agents / ${{ github.event_name == 'schedule' && 'latest' || inputs.versions || 'pinned' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run selected compatibility checks
        env:
          AGENT: ${{ inputs.agent || 'all' }}
          AGENT_VERSIONS: ${{ github.event_name == 'schedule' && 'latest' || inputs.versions || 'pinned' }}
        run: |
          if [ "$AGENT" = all ]; then
            pnpm test:compat
          else
            pnpm test:compat -- "$AGENT"
          fi
