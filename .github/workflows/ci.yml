name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify; defaults to the triggering commit
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Checks / Node LTS / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
