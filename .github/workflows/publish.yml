name: Publish to npm
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package.json, for example v0.1.0
        required: true
        type: string
      publish:
        description: Publish after verification and environment approval
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  metadata:
    name: Resolve and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag must match package version');
          assert.equal(pkg.license, 'MIT');
          assert(readFileSync('LICENSE', 'utf8').includes('MIT License'));
          assert.equal(pkg.repository.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          JS
          git merge-base --is-ancestor HEAD origin/main
      - name: Record immutable source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    name: Verify package
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  compatibility:
    name: Verify real agents
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compat
  publish:
    name: Publish approved version
    if: ${{ github.event_name == 'push' || (inputs.publish && github.ref == 'refs/heads/main') }}
    needs: [metadata, verify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The exact source commit passed verification above; build explicitly
      # instead of running the entire test suite again in publication hooks.
      - run: npm publish --access public --provenance --ignore-scripts
