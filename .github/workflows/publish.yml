name: Publish to npm
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package.json, for example v0.2.0
        required: true
        type: string
      publish:
        description: Publish after verification and environment approval
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  metadata:
    name: Resolve and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-check.mjs "$RELEASE_TAG"
      - name: Check tag belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Check registry state
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "agent-request-logger@$version" version >/dev/null 2>&1; then
            echo "::notice::agent-request-logger@$version is already on npm; publication will be skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Record immutable source commit
        id: commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  verify:
    name: Verify package
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  compatibility:
    name: Verify real agents
    needs: metadata
    uses: ./.github/workflows/compatibility.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  publish:
    name: Publish approved version
    if: >-
      needs.metadata.outputs.published != 'true' &&
      (github.event_name == 'push' || (inputs.publish && github.ref == 'refs/heads/main'))
    needs: [metadata, verify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.1
      - name: Check trusted-publishing prerequisites
        # Fail with a clear cause instead of npm's generic ENEEDAUTH.
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token is available. The job needs 'id-token: write'."
            exit 1
          fi
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} cannot use trusted publishing; 11.5.1+ is required.`); process.exit(1); }
          ' "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The exact source commit passed verification above; build explicitly
      # instead of running the entire test suite again in publication hooks.
      - name: Publish with provenance
        run: |
          if ! npm publish --access public --provenance --ignore-scripts; then
            echo "::error::npm rejected the publication. If the log shows ENEEDAUTH, check the npm trusted publisher for this package: owner '${{ github.repository_owner }}', repository '${{ github.event.repository.name }}', workflow 'publish.yml', environment 'npm-release'. See docs/releases.md."
            exit 1
          fi
  release:
    name: Create GitHub release
    needs: [metadata, publish]
    # Also repair a missing GitHub release when npm already has the version.
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      (needs.publish.result == 'success' || needs.metadata.outputs.published == 'true') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Publish release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node scripts/release-check.mjs "$TAG" --notes > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
