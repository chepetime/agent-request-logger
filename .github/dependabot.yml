version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep @types/node on the engines floor (Node 22) so types never promise
    # APIs that the oldest supported runtime lacks.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
      runtime:
        dependency-type: production
